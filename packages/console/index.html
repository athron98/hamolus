<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var palettes = ['blue', 'azure', 'cyan', 'teal', 'green', 'lime', 'amber', 'gold', 'orange', 'coral', 'crimson', 'rose', 'pink', 'violet', 'indigo', 'slate'];
        var fonts = ['system', 'inter', 'geist', 'plex', 'roboto'];
        var legacyPresets = { midnight: ['dark', 'blue'], dusk: ['dark', 'violet'], silver: ['dark', 'amber'], paper: ['light', 'amber'], mist: ['light', 'blue'] };
        var raw = localStorage.getItem('console-theme');
        var mode = null;
        var theme = null;
        var font = 'inter';
        if (raw) {
          if (legacyPresets[raw]) { mode = legacyPresets[raw][0]; theme = legacyPresets[raw][1]; }
          else if (raw === 'dark') { mode = 'dark'; }
          else if (raw === 'light') { mode = 'light'; }
          else {
            try {
              var p = JSON.parse(raw);
              if (p && (p.mode === 'dark' || p.mode === 'light')) {
                mode = p.mode;
                if (p.palette && palettes.indexOf(p.palette) !== -1) theme = p.palette;
                else if (p.theme && palettes.indexOf(p.theme) !== -1) theme = p.theme;
                else if (p.accent && palettes.indexOf(p.accent) !== -1) theme = p.accent;
                if (p.font && fonts.indexOf(p.font) !== -1) font = p.font;
              }
            } catch (e) {}
          }
        }
        if (!mode) mode = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        if (!theme) theme = mode === 'light' ? 'amber' : 'blue';
        document.documentElement.dataset.mode = mode;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.font = font;
      } catch (e) {}
    </script>
    <script type="module">
      import.meta.env.DEV && import('virtual:stylex:runtime');
    </script>
    <link rel="stylesheet" href="/virtual:stylex.css" />
  </head>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
